name: LMS Full Deployment

on:
  push:
    branches:
      - "main"
    paths:
      - 'frontend/**'  # React app files
      - 'backend/**'   # CDK backend files
      - 'package.json'
      - 'package-lock.json'

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18.x'
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - run: aws s3 sync build/ s3://${{ secrets.AWS_S3_BUCKET }} --acl public-read --delete

  backend:
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v3
      
      # Copy template.html from frontend to lambda directory
      - name: Prepare Lambda assets
        run: |
          mkdir -p lambda/email
          cp ../frontend/public/index.html lambda/template.html
          cp ../frontend/public/index.html lambda/email/template.html
          
      - uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          
      - run: npm ci
      
      - run: npm run build
      
      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          
      - name: CDK Bootstrap
        run: npx cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ secrets.AWS_REGION }}
        
      - name: CDK Deploy
        run: npx cdk deploy --require-approval never
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}