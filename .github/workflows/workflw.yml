name: LMS Full Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - prod
      action:
        description: 'Deploy or Destroy'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - destroy

jobs:
  frontend-deploy:
    if: github.event_name == 'push' || github.event.inputs.action == 'deploy'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3 and Invalidate CloudFront
        run: |
            ENV="${{ github.event.inputs.environment }}"
            if [ -z "$ENV" ]; then
            ENV="beta"
            fi

            BUCKET="${{ secrets.AWS_S3_BUCKET }}"

            if [ "$ENV" = "prod" ]; then
            S3_TARGET="s3://$BUCKET/"
            INVALIDATION_PATH="/*"
            else
            S3_TARGET="s3://$BUCKET/$ENV/"
            INVALIDATION_PATH="/$ENV/*"
            fi

      - name: Invalidate CloudFront cache
        run: |
            ENV="${{ github.event.inputs.environment }}"
            if [ -z "$ENV" ]; then
            ENV="beta"
            fi

            if [ "$ENV" = "prod" ]; then
            PATHS="/*"
            else
            PATHS="/$ENV/*"
            fi

            echo "Invalidating CloudFront distribution ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} at path: $PATHS"
            aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "$PATHS"
  backend:
    needs: frontend-deploy
    if: (github.event_name == 'push' || github.event.inputs.action == 'deploy') && success()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: CDK Bootstrap
        run: |
            export AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
            export AWS_REGION=${{ secrets.AWS_REGION }}
            echo "Bootstrapping CDK for account: $AWS_ACCOUNT_ID in region: $AWS_REGION"
            npx cdk bootstrap aws://$AWS_ACCOUNT_ID/$AWS_REGION
        env:
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: CDK Deploy
        run: |
          ENV=${{ github.event.inputs.environment }}
          if [ -z "$ENV" ]; then
            ENV="beta"
          fi
          echo "Deploying backend for $ENV"
          npx cdk deploy --require-approval never --context env=$ENV
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

  backend-destroy:
    if: github.event.inputs.action == 'destroy'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: CDK Destroy
        run: |
          ENV=${{ github.event.inputs.environment }}
          echo "Destroying backend for $ENV"
          npx cdk destroy --force --context env=$ENV
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
