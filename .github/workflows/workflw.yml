name: LMS Release and Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - staging
          - prod
      action:
        description: 'Deploy or Destroy'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - destroy
  release:
    types: [published]

jobs:
  detect-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - id: filter
        run: |
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} > changes.txt
          FRONTEND=false
          BACKEND=false
          if grep -q "^frontend/" changes.txt; then FRONTEND=true; fi
          if grep -q "^backend/" changes.txt; then BACKEND=true; fi
          echo "frontend=$FRONTEND" >> $GITHUB_OUTPUT
          echo "backend=$BACKEND" >> $GITHUB_OUTPUT

  semantic-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v3
        with:
          node-version: '20.9.0' # ✅ Required by semantic-release

      - run: npm ci

      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx semantic-release

  frontend-deploy:
    needs: [detect-changes]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy' || needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'release'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Determine deployment target and version
        id: vars
        run: |
          ENV=""
          VERSION=""
          if [ "${{ github.event_name }}" = "release" ]; then
            ENV="prod"
            VERSION="${{ github.event.release.tag_name }}"
          else
            ENV="${{ github.event.inputs.environment }}"
            if [ -z "$ENV" ]; then ENV="prod"; fi
            VERSION="latest"
          fi
          echo "env=$ENV" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Archive old version (only on release)
        if: github.event_name == 'release'
        run: |
          BUCKET=${{ secrets.AWS_S3_BUCKET }}
          VERSION=${{ steps.vars.outputs.version }}
          echo "Archiving current 'latest' as version $VERSION"
          aws s3 cp s3://$BUCKET/ s3://$BUCKET/archive/$VERSION/ --recursive

      - name: Upload to S3 and invalidate CloudFront
        run: |
          BUCKET=${{ secrets.AWS_S3_BUCKET }}
          ENV=${{ steps.vars.outputs.env }}
          VERSION=${{ steps.vars.outputs.version }}

          if [ "$ENV" = "prod" ]; then
            TARGET="s3://$BUCKET/$VERSION/"
            INVALIDATION_PATH="/*"
          else
            TARGET="s3://$BUCKET/$ENV/"
            INVALIDATION_PATH="/$ENV/*"
          fi

          echo "Syncing to $TARGET"
          aws s3 sync dist/ "$TARGET" --delete --acl public-read

          echo "Invalidating CloudFront cache at $INVALIDATION_PATH"
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "$INVALIDATION_PATH"

  backend:
    needs: [frontend-deploy, detect-changes]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy' || needs.detect-changes.outputs.backend == 'true' || github.event_name == 'release'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: CDK Bootstrap
        run: |
          export AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
          export AWS_REGION=${{ secrets.AWS_REGION }}
          npx cdk bootstrap aws://$AWS_ACCOUNT_ID/$AWS_REGION
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Determine environment for deploy
        id: envvar
        run: |
          ENV=""
          if [ "${{ github.event_name }}" = "release" ]; then
            ENV="prod"
          else
            ENV="${{ github.event.inputs.environment }}"
            if [ -z "$ENV" ]; then ENV="prod"; fi
          fi
          echo "env=$ENV" >> $GITHUB_OUTPUT

      - name: CDK Deploy
        run: |
          ENV=${{ steps.envvar.outputs.env }}
          echo "Deploying backend for $ENV"
          npx cdk deploy --require-approval never --context env=$ENV
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

  backend-destroy:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: CDK Destroy
        run: |
          ENV="${{ github.event.inputs.environment }}"
          echo "Destroying backend for $ENV"
          npx cdk destroy --force --context env=$ENV
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
