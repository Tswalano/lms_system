name: LMS Release and Deployment

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - prod
      action:
        description: "Deploy or Destroy"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - destroy
      target:
        description: "What to deploy"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - backend-only
          - frontend-only
          - mobile-frontend-only
  release:
    types: [ published ]

jobs:
  detect-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile_frontend: ${{ steps.filter.outputs.mobile_frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      branch: ${{ steps.filter.outputs.branch }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - id: filter
        run: |
          FRONTEND=false
          MOBILE_FRONTEND=false
          BACKEND=false
          BRANCH=${GITHUB_REF##*/}

          # Handle case where there's no previous commit (first push)
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            echo "First push detected, checking all files"
            git ls-tree -r --name-only HEAD > changes.txt
          else
            echo "Comparing ${{ github.event.before }} to ${{ github.sha }}"
            if ! git diff --name-only ${{ github.event.before }} ${{ github.sha }} > changes.txt 2>/dev/null; then
              echo "Git diff failed, falling back to HEAD~1"
              git diff --name-only HEAD~1 HEAD > changes.txt 2>/dev/null || git ls-tree -r --name-only HEAD > changes.txt
            fi
          fi

          echo "Changed files:"
          cat changes.txt

          if grep -q "^frontend/" changes.txt; then 
            FRONTEND=true
            echo "Frontend changes detected"
          fi
          if grep -q "^mobile_web_app/" changes.txt; then
            MOBILE_FRONTEND=true
            echo "Mobile frontend changes detected"
          fi
          if grep -q "^backend/" changes.txt; then 
            BACKEND=true
            echo "Backend changes detected"
          fi

          echo "frontend=$FRONTEND" >> $GITHUB_OUTPUT
          echo "mobile_frontend=$MOBILE_FRONTEND" >> $GITHUB_OUTPUT
          echo "backend=$BACKEND" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Frontend: $FRONTEND, Mobile frontend: $MOBILE_FRONTEND, Backend: $BACKEND, Branch: $BRANCH"

  semantic-release:
    needs: [ detect-changes ]
    if: |
      github.event_name == 'push' && 
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    outputs:
      new-release-published: ${{ steps.semantic.outputs.new-release-published }}
      new-release-version: ${{ steps.semantic.outputs.new-release-version }}
      release-type: ${{ steps.semantic.outputs.release-type }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/setup-node@v3
        with:
          node-version: "20.9.0"
      - run: npm ci
      - name: Run semantic-release
        id: semantic
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "Running semantic-release on branch: ${GITHUB_REF##*/}"

          # Run semantic-release and capture output
          npx semantic-release --dry-run=false > semantic-output.log 2>&1 || true
          cat semantic-output.log

          # Check if a release was published
          if grep -q "Published release" semantic-output.log; then
            echo "new-release-published=true" >> $GITHUB_OUTPUT
            
            # Extract version from semantic-release output
            VERSION=$(grep -o "Published release [0-9]\+\.[0-9]\+\.[0-9]\+\(-dev\.[0-9]\+\)\?" semantic-output.log | sed 's/Published release //')
            if [ -z "$VERSION" ]; then
              # Fallback: get version from package.json if semantic-release updated it
              VERSION=$(node -p "require('./package.json').version")
            fi
            
            echo "new-release-version=$VERSION" >> $GITHUB_OUTPUT
            
            # Determine release type
            if [[ "$VERSION" =~ -dev\. ]]; then
              echo "release-type=prerelease" >> $GITHUB_OUTPUT
            else
              echo "release-type=release" >> $GITHUB_OUTPUT
            fi
            
            echo "Released version: $VERSION"
          else
            echo "new-release-published=false" >> $GITHUB_OUTPUT
            echo "No new release published"
          fi

  frontend-deploy:
    needs: [ detect-changes, semantic-release ]
    if: |
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy' && (github.event.inputs.target == 'both' || github.event.inputs.target == 'frontend-only')) ||
        (needs.detect-changes.result == 'success' && needs.detect-changes.outputs.frontend == 'true') ||
        (github.event_name == 'release') ||
        (needs.semantic-release.result == 'success')
      )
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      environment: ${{ steps.set-version.outputs.environment }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/setup-node@v3
        with:
          node-version: "18.x"
      - run: npm ci
      - name: Set version environment variable
        id: set-version
        run: |
          BRANCH=${GITHUB_REF##*/}
          ENV=""
          VERSION=""

          echo "Branch: $BRANCH"
          echo "Event: ${{ github.event_name }}"
          echo "Semantic release published: ${{ needs.semantic-release.outputs.new-release-published }}"
          echo "Semantic release version: ${{ needs.semantic-release.outputs.new-release-version }}"
          echo "Release type: ${{ needs.semantic-release.outputs.release-type }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            ENV="prod"
          elif [ "$BRANCH" = "dev" ]; then
            ENV="dev"
          elif [ "$BRANCH" = "main" ]; then
            ENV="prod"
          else
            echo "Unable to determine deployment environment for ref ${GITHUB_REF}"
            exit 1
          fi

          # If semantic-release published a new version, use it
          if [ "${{ needs.semantic-release.outputs.new-release-published }}" = "true" ]; then
            VERSION="${{ needs.semantic-release.outputs.new-release-version }}"
          elif [ "$BRANCH" = "dev" ]; then
            # For dev branch without semantic release, create a dev version
            BASE_VERSION=$(node -p "require('../package.json').version")
            SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
            VERSION="${BASE_VERSION}-dev.${SHORT_SHA}"
            ENV="dev"
          elif [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            ENV="prod"
          else
            # Fallback for main branch
            LATEST_RELEASE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" | \
              grep '"tag_name":' | sed -E 's/.*"tag_name": "([^"]*).*/\1/' || echo "")
            if [ ! -z "$LATEST_RELEASE" ]; then
              VERSION="$LATEST_RELEASE"
            else
              VERSION=$(node -p "require('../package.json').version")
            fi
          fi


          echo "VITE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "=== FRONTEND VERSION: $VERSION ==="
          echo "=== ENVIRONMENT: $ENV ==="

      - name: Build with version
        run: npm run build -- --mode ${{ steps.set-version.outputs.environment }}
        env:
          VITE_VERSION: ${{ env.VITE_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3 and invalidate CloudFront
        run: |
          BUCKET=${{ secrets.AWS_S3_BUCKET }}
          ENV=${{ steps.set-version.outputs.environment }}
          VERSION=${{ steps.set-version.outputs.version }}

          if [ "$ENV" = "prod" ]; then
            TARGET="s3://$BUCKET/prod/"
            CF_ID="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          else
            TARGET="s3://$BUCKET/dev-fe/"
            CF_ID="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_DEV }}"
          fi

          if [ -z "$CF_ID" ]; then
            echo "CloudFront distribution ID is not configured for environment: $ENV"
            exit 1
          fi

          echo "Syncing version $VERSION to $TARGET"

          # Archive the current prod before deploying (prod only)
          if [ "$ENV" = "prod" ]; then
            PREV_VERSION=$(aws s3 cp "${TARGET}version.json" - 2>/dev/null | \
              python3 -c "import sys,json; print(json.load(sys.stdin).get('version',''))" 2>/dev/null || echo "")

            if [ -n "$PREV_VERSION" ] && [ "$PREV_VERSION" != "$VERSION" ]; then
              echo "Archiving v$PREV_VERSION to ${TARGET}v${PREV_VERSION}/"
              aws s3 cp "$TARGET" "${TARGET}v${PREV_VERSION}/" \
                --recursive \
                --exclude "v[0-9]*/*"
            fi
          fi

          # Stamp version.json into the build output before syncing
          echo "{\"version\":\"$VERSION\",\"deployedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
            > dist/version.json

          # Sync new build; --exclude preserves archived version folders from --delete
          aws s3 sync dist/ "$TARGET" --delete --exclude "v[0-9]*/*"

          echo "Invalidating CloudFront ($CF_ID) cache"
          aws cloudfront create-invalidation \
            --distribution-id "$CF_ID" \
            --paths "/*"

  mobile-frontend-deploy:
    needs: [ detect-changes, semantic-release ]
    if: |
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy' && (github.event.inputs.target == 'both' || github.event.inputs.target == 'mobile-frontend-only')) ||
        (needs.detect-changes.result == 'success' && needs.detect-changes.outputs.mobile_frontend == 'true')
      )
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile_web_app
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/setup-node@v3
        with:
          node-version: "20.x"
      - run: npm ci
      - name: Set version environment variable
        id: set-version
        run: |
          VERSION=""

          echo "Event: ${{ github.event_name }}"
          echo "Semantic release published: ${{ needs.semantic-release.outputs.new-release-published }}"
          echo "Semantic release version: ${{ needs.semantic-release.outputs.new-release-version }}"

          if [ "${{ needs.semantic-release.outputs.new-release-published }}" = "true" ]; then
            VERSION="${{ needs.semantic-release.outputs.new-release-version }}"
          else
            BASE_VERSION=$(node -p "require('../package.json').version")
            SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
            VERSION="${BASE_VERSION}-dev.${SHORT_SHA}"
          fi

          echo "VITE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "environment=dev" >> $GITHUB_OUTPUT
          echo "=== MOBILE FRONTEND VERSION: $VERSION ==="
          echo "=== ENVIRONMENT: dev ==="

      - name: Build with version
        run: npm run build -- --mode dev
        env:
          VITE_VERSION: ${{ env.VITE_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3 and invalidate CloudFront
        run: |
          BUCKET=${{ secrets.AWS_S3_BUCKET }}
          VERSION=${{ steps.set-version.outputs.version }}
          TARGET="s3://$BUCKET/dev-mobile-fe/"
          CF_ID="${{ secrets.MOBILE_DEV_CLOUDFRONT_DISTRIBUTION_ID }}"

          echo "Syncing version $VERSION to $TARGET"
          aws s3 sync dist/ "$TARGET" --delete --acl public-read

          echo "Invalidating CloudFront ($CF_ID) cache"
          aws cloudfront create-invalidation \
            --distribution-id "$CF_ID" \
            --paths "/*"

  backend:
    needs: [ frontend-deploy, detect-changes ]
    if: |
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy' && (github.event.inputs.target == 'both' || github.event.inputs.target == 'backend-only')) ||
        (needs.detect-changes.result == 'success' && needs.detect-changes.outputs.backend == 'true') ||
        github.event_name == 'release'
      )
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "18.x"
      - run: npm ci
      - name: Run Prisma database migration 
        run: |
          echo "Running Prisma database migration"
        
          BRANCH=${GITHUB_REF##*/}
          if [ "$BRANCH" = "main" ]; then
            export DATABASE_URL=${{ secrets.PROD_DB_URL }}
          else
            export DATABASE_URL=${{ secrets.DEV_DB_URL }}
          fi

          npx prisma migrate deploy 
      - name: Generate Prisma Client
        run: npx prisma generate
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: CDK Bootstrap
        run: npx cdk bootstrap
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      - name: Determine environment for deploy
        id: envvar
        run: |
          ENV=""
          BRANCH=${GITHUB_REF##*/}
          if [ "${{ github.event_name }}" = "release" ] || [ "$BRANCH" = "main" ]; then
            ENV="prod"
          else
            ENV="dev"
          fi
          echo "env=$ENV" >> $GITHUB_OUTPUT

      - name: CDK Deploy
        run: |
          ENV=${{ steps.envvar.outputs.env }}
          echo "Deploying backend for $ENV"
          npx cdk deploy --require-approval never --context environment=$ENV
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

  backend-destroy:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action ==
      'destroy'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "18.x"
      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: CDK Destroy
        run: |
          ENV="${{ github.event.inputs.environment }}"
          echo "Destroying backend for $ENV"
          npx cdk destroy --force --context environment=$ENV
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
