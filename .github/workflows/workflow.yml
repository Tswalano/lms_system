name: LMS Release and Deployment

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - prod
      action:
        description: 'Deploy or Destroy'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - destroy
  release:
    types: [published]

jobs:
  detect-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - id: filter
        run: |
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} > changes.txt
          FRONTEND=false
          BACKEND=false
          if grep -q "^frontend/" changes.txt; then FRONTEND=true; fi
          if grep -q "^backend/" changes.txt; then BACKEND=true; fi
          echo "frontend=$FRONTEND" >> $GITHUB_OUTPUT
          echo "backend=$BACKEND" >> $GITHUB_OUTPUT

  semantic-release:
    needs: [detect-changes]
    if: |
      github.event_name == 'push' && 
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    outputs:
      new-release-published: ${{ steps.semantic.outputs.new-release-published }}
      new-release-version: ${{ steps.semantic.outputs.new-release-version }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v3
        with:
          node-version: '20.9.0'

      - run: npm ci

      - name: Run semantic-release
        id: semantic
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          npx semantic-release
          if [ -f .semantic-release-output ]; then
            NEW_VERSION=$(cat .semantic-release-output)
            echo "new-release-published=true" >> $GITHUB_OUTPUT
            echo "new-release-version=$NEW_VERSION" >> $GITHUB_OUTPUT
          else
            echo "new-release-published=false" >> $GITHUB_OUTPUT
          fi

  frontend-deploy:
    needs: [detect-changes, semantic-release]
    if: |
      always() && 
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy') ||
        (needs.detect-changes.result == 'success' && needs.detect-changes.outputs.frontend == 'true') ||
        (github.event_name == 'release') ||
        (needs.semantic-release.result == 'success')
      )
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - run: npm ci

      - name: Set version environment variable
        id: set-version
        run: |
          BRANCH=${GITHUB_REF##*/}
          ENV="${{ github.event.inputs.environment || 'prod' }}"
          VERSION=""

          if [ "$BRANCH" = "dev" ]; then
            BASE_VERSION=$(node -p "require('../package.json').version")
            SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
            VERSION="${BASE_VERSION}-dev.${SHORT_SHA}"
            ENV="dev"
          elif [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            ENV="prod"
          elif [ "${{ needs.semantic-release.outputs.new-release-published }}" = "true" ]; then
            VERSION="${{ needs.semantic-release.outputs.new-release-version }}"
            ENV="prod"
          else
            # fallback
            LATEST_RELEASE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" | \
              grep '"tag_name":' | sed -E 's/.*"tag_name": "([^"]*).*/\1/' || echo "")
            if [ ! -z "$LATEST_RELEASE" ]; then
              VERSION="$LATEST_RELEASE"
              ENV="prod"
            else
              VERSION=$(node -p "require('../package.json').version")
              ENV="prod"
            fi
          fi

          echo "VITE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "=== FRONTEND VERSION: $VERSION ==="

      - name: Build with version
        run: npm run build
        env:
          VITE_VERSION: ${{ env.VITE_VERSION }}
          
      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3 and invalidate CloudFront
        run: |
          BUCKET=${{ secrets.AWS_S3_BUCKET }}
          ENV=${{ steps.set-version.outputs.environment }}
          VERSION=${{ steps.set-version.outputs.version }}

          if [ "$ENV" = "prod" ]; then
            TARGET="s3://$BUCKET/prod/"
            CF_ID="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          else
            TARGET="s3://$BUCKET/dev-fe/"
            CF_ID="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_DEV }}"
          fi

          echo "Syncing version $VERSION to $TARGET"
          aws s3 sync dist/ "$TARGET" --delete --acl public-read

          echo "Invalidating CloudFront ($CF_ID) cache"
          aws cloudfront create-invalidation \
            --distribution-id "$CF_ID" \
            --paths "/*"
