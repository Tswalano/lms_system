      summary: Get notification settings
      responses:
        '200':
          description: User's notification settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    patch:
      tags: [Notifications]
      summary: Update notification settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emailEnabled:
                  type: boolean
                pushEnabled:
                  type: boolean
