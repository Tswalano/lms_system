  /notifications/broadcast:
    post:
      tags: [Notifications]
      summary: Broadcast notification to multiple users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SendNotificationRequest'
                - type: object
                  properties:
                    recipientIds:
                      type: array
                      items:
                        type: string
                        format: uuid
                    recipientId:
                      description: Ignored for broadcasts — use recipientIds
                      readOnly: true
      responses:
        '201':
          description: Broadcast sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

