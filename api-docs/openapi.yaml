  # ══════════════════════════════════════════════════════
  # NOTIFICATIONS
  # ══════════════════════════════════════════════════════
  /notifications/:
    get:
      tags: [Notifications]
      summary: List notifications
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: type
          in: query
          schema:
            type: string
            enum: [info, success, warning, error, reminder, action_required]
        - name: category
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, normal, high, urgent]
        - name: isRead
          in: query
          schema:
            type: boolean
        - name: isArchived
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Notifications list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Notification'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'

  /notifications/counts:
    get:
      tags: [Notifications]
      summary: Get notification count summary
      description: Returns total, unread, and archived counts.
      responses:
        '200':
          description: Count summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          total:
                            type: integer
                          unread:
                            type: integer
                          archived:
                            type: integer

